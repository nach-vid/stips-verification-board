<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>לוח מסרים סטיפס</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f8f9fa;
      color: #212529;
      direction: rtl;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── מסך התחברות ─── */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .auth-card {
      background: #ffffff;
      border: 1px solid #e9ecef;
      border-radius: 14px;
      padding: 28px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    .auth-card h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1a1e21;
      margin-bottom: 6px;
    }

    .auth-card p.desc {
      font-size: 0.88rem;
      color: #6c757d;
      margin-bottom: 22px;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #495057;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #ffffff;
      direction: ltr;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .form-group input:focus {
      border-color: #212529;
    }

    .btn-main {
      width: 100%;
      padding: 12px 16px;
      background: #111827;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }

    .btn-main:hover:not(:disabled) {
      background: #374151;
    }

    .btn-main:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* שלב קוד אימות */
    #code-box-wrapper {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #e9ecef;
    }

    .code-banner {
      background: #f1f3f5;
      border: 1px dashed #adb5bd;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      margin-bottom: 14px;
    }

    .code-banner span {
      display: block;
      font-size: 0.78rem;
      color: #6c757d;
      margin-bottom: 4px;
    }

    .code-banner strong {
      display: block;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 3px;
      direction: ltr;
      color: #212529;
    }

    .steps-list {
      font-size: 0.84rem;
      color: #495057;
      padding-right: 18px;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .steps-list a {
      color: #0d6efd;
      text-decoration: none;
      font-weight: 600;
    }

    .steps-list a:hover {
      text-decoration: underline;
    }

    .status-alert {
      font-size: 0.84rem;
      margin-top: 12px;
      min-height: 18px;
      text-align: center;
    }
    .status-alert.error { color: #dc3545; }
    .status-alert.success { color: #198754; }

    /* ─── מסך לוח מסרים ─── */
    #board-screen {
      display: none;
      min-height: 100vh;
      flex-direction: column;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      background: #ffffff;
      border-left: 1px solid #e9ecef;
      border-right: 1px solid #e9ecef;
    }

    /* סרגל עליון */
    .board-header {
      padding: 14px 18px;
      border-bottom: 1px solid #e9ecef;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: #ffffff;
      z-index: 10;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-user img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #dee2e6;
      background: #f1f3f5;
    }

    .header-user .info {
      display: flex;
      flex-direction: column;
    }

    .header-user .name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #111827;
      line-height: 1.2;
    }

    .header-user .tag {
      font-size: 0.75rem;
      color: #6c757d;
      direction: ltr;
      text-align: right;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #495057;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-logout:hover {
      background: #f8f9fa;
      color: #dc3545;
      border-color: #f5c2c7;
    }

    /* תיבת פרסום מסר חדש */
    .post-composer {
      padding: 16px 18px;
      border-bottom: 1px solid #e9ecef;
      background: #fafbfc;
    }

    .post-composer textarea {
      width: 100%;
      height: 76px;
      padding: 12px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 0.92rem;
      font-family: inherit;
      resize: none;
      direction: rtl;
      outline: none;
      background: #ffffff;
      margin-bottom: 10px;
      transition: border-color 0.15s ease;
    }

    .post-composer textarea:focus {
      border-color: #111827;
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .composer-status {
      font-size: 0.8rem;
      color: #6c757d;
    }

    .btn-publish {
      padding: 8px 20px;
      background: #111827;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-publish:hover:not(:disabled) {
      background: #374151;
    }

    .btn-publish:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* רשימת המסרים (Message Feed) */
    .feed-container {
      flex: 1;
      padding: 8px 0;
      overflow-y: auto;
    }

    .message-card {
      padding: 16px 18px;
      border-bottom: 1px solid #f1f3f5;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      transition: background-color 0.1s ease;
    }

    .message-card:hover {
      background-color: #fafbfc;
    }

    .message-card img.avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid #e9ecef;
      background: #e9ecef;
    }

    .message-body {
      flex: 1;
      min-width: 0;
    }

    .message-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .author-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #111827;
    }

    .message-time {
      font-size: 0.74rem;
      color: #868e96;
      direction: ltr;
    }

    .message-text {
      font-size: 0.92rem;
      line-height: 1.55;
      color: #212529;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty-feed {
      text-align: center;
      padding: 50px 20px;
      color: #adb5bd;
      font-size: 0.92rem;
    }

    /* התאמה למובייל */
    @media (max-width: 680px) {
      #board-screen {
        border-left: none;
        border-right: none;
      }
      .board-header {
        padding: 12px 14px;
      }
      .post-composer {
        padding: 12px 14px;
      }
      .message-card {
        padding: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- ═══ מסך 1: התחברות ואימות ═══ -->
  <div id="login-screen">
    <div class="auth-card">
      <h1>לוח מסרים סטיפס</h1>
      <p class="desc">התחבר באמצעות אימות קוד בפרופיל הסטיפס שלך.</p>

      <!-- הזנת מזהה סטיפס -->
      <form id="auth-form">
        <div class="form-group">
          <label for="stips-input">מזהה סטיפס (מספר ID או קישור לפרופיל):</label>
          <input type="text" id="stips-input" placeholder="לדוגמה: 428498" required autocomplete="off">
        </div>
        <button type="submit" id="btn-get-code" class="btn-main">קבל קוד אימות</button>
      </form>

      <!-- קוד אימות והוראות -->
      <div id="code-box-wrapper" hidden>
        <div class="code-banner">
          <span>העתק את הקוד הבא לביו שלך:</span>
          <strong id="code-text"></strong>
        </div>

        <ol class="steps-list">
          <li>פתח את הפרופיל שלך: <a id="stips-link" href="#" target="_blank" rel="noopener">פתח בסטיפס</a></li>
          <li>הדבק את הקוד בתיאור הפרופיל (ביו) ושמור.</li>
          <li>לחץ על "אמת וכנס" למטה.</li>
        </ol>

        <button type="button" id="btn-verify" class="btn-main">אמת וכנס ללוח</button>
      </div>

      <div id="auth-status" class="status-alert"></div>
    </div>
  </div>

  <!-- ═══ מסך 2: לוח המסרים ═══ -->
  <div id="board-screen">
    <!-- סרגל עליון -->
    <header class="board-header">
      <div class="header-user">
        <img id="my-avatar" src="" alt="תמונת פרופיל">
        <div class="info">
          <span class="name" id="my-name">משתמש</span>
          <span class="tag" id="my-tag">@stips</span>
        </div>
      </div>
      <button type="button" id="btn-logout" class="btn-logout">התנתק</button>
    </header>

    <!-- תיבת פרסום מסר -->
    <section class="post-composer">
      <form id="composer-form">
        <textarea id="composer-text" placeholder="כתוב מסר ללוח הקהילה..." required maxlength="1000"></textarea>
        <div class="composer-footer">
          <span id="composer-status" class="composer-status"></span>
          <button type="submit" id="btn-publish" class="btn-publish">פרסם מסר</button>
        </div>
      </form>
    </section>

    <!-- רשימת המסרים (Feed) -->
    <main class="feed-container" id="feed-container">
      <div class="empty-feed" id="feed-loading">טוען מסרים...</div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
