<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>לוח הודעות סטיפס</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
      direction: rtl;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 16px 20px;
      text-align: center;
    }
    header h1 { font-size: 1.3rem; font-weight: 700; }

    .container { max-width: 600px; margin: 24px auto; padding: 0 14px; }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 22px 20px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 5px;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.93rem;
      background: #fafafa;
      direction: ltr;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #666;
      background: #fff;
    }

    .btn {
      padding: 9px 18px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: #fff;
      color: #222;
      transition: background 0.15s;
    }
    .btn:hover:not(:disabled) { background: #f0f0f0; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-dark { background: #222; color: #fff; border-color: #222; }
    .btn-dark:hover:not(:disabled) { background: #444; }
    .btn-sm { padding: 6px 12px; font-size: 0.82rem; }

    .row { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
    .row input { flex: 1; }

    .code-box {
      background: #f5f5f5;
      border: 1px dashed #bbb;
      border-radius: 8px;
      padding: 12px 16px;
      text-align: center;
      margin: 12px 0;
    }
    .code-box small { font-size: 0.78rem; color: #888; display: block; margin-bottom: 4px; }
    .code-box .code { font-size: 1.4rem; font-weight: 800; letter-spacing: 2px; direction: ltr; }

    ol.steps { padding-right: 18px; margin: 10px 0; }
    ol.steps li { font-size: 0.88rem; color: #444; padding: 5px 0; line-height: 1.5; }

    #status-msg { margin-top: 10px; font-size: 0.85rem; min-height: 18px; }
    #status-msg.error   { color: #c00; }
    #status-msg.success { color: #2a7a2a; }

    /* user bar */
    .user-bar { display: flex; align-items: center; gap: 12px; }
    .user-bar img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 1px solid #ddd; flex-shrink: 0; }
    .user-info { flex: 1; }
    .user-info .name { font-weight: 700; font-size: 0.95rem; }
    .user-info .uid  { font-size: 0.78rem; color: #888; direction: ltr; }

    /* messages */
    .messages-wrap { max-height: 320px; overflow-y: auto; }

    .msg-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; align-items: flex-start; }
    .msg-item:last-child { border-bottom: none; }
    .msg-item img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .msg-body .msg-name { font-weight: 700; font-size: 0.85rem; }
    .msg-body .msg-time { font-size: 0.75rem; color: #aaa; }
    .msg-body .msg-text { font-size: 0.9rem; margin-top: 2px; }

    .empty-msg { text-align: center; color: #bbb; padding: 20px 0; font-size: 0.88rem; }

    .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .board-header h2 { border: none; padding: 0; margin: 0; }

    #message-status { font-size: 0.82rem; color: #888; margin-top: 6px; min-height: 16px; }

    @media (max-width: 480px) {
      .row { flex-direction: column; }
      .row .btn { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <h1>לוח הודעות סטיפס</h1>
</header>

<div class="container">

  <!-- אימות -->
  <section id="verification-section">
    <div class="card">
      <h2>התחברות עם פרופיל סטיפס</h2>
      <form id="generate-code-form">
        <label for="username-input">מספר ID או קישור לפרופיל בסטיפס</label>
        <div class="row">
          <input type="text" id="username-input"
            placeholder="428498 או https://stips.co.il/profile/428498" required autocomplete="off">
          <button type="submit" id="generate-btn" class="btn btn-dark">קבל קוד</button>
        </div>
      </form>
      <div id="status-msg"></div>
    </div>

    <div class="card" id="code-section" hidden>
      <h2>הדבק את הקוד בביו שלך בסטיפס</h2>

      <div class="code-box">
        <small>העתק את הקוד הזה:</small>
        <div class="code" id="display-code"></div>
      </div>

      <ol class="steps">
        <li>כנס לפרופיל שלך: <a id="stips-profile-link" href="#" target="_blank">פתח בסטיפס</a></li>
        <li>הדבק את הקוד בתיאור / ביו שלך ושמור.</li>
        <li>חזור לכאן ולחץ "אמת".</li>
      </ol>

      <div style="margin-top:14px;">
        <button type="button" id="verify-btn" class="btn btn-dark">אמת פרופיל</button>
      </div>
    </div>
  </section>

  <!-- לוח הודעות -->
  <section id="board-section" hidden>

    <div class="card">
      <div class="user-bar">
        <img id="logged-user-avatar" src="" alt="פרופיל">
        <div class="user-info">
          <div class="name" id="logged-user-name"></div>
          <div class="uid"  id="logged-user-bio"></div>
        </div>
        <button type="button" id="logout-btn" class="btn btn-sm">התנתק</button>
      </div>
    </div>

    <div class="card">
      <div class="board-header">
        <h2>הודעות</h2>
        <button type="button" id="refresh-messages-btn" class="btn btn-sm">רענן</button>
      </div>

      <div class="messages-wrap">
        <div id="messages-list"></div>
      </div>

      <hr style="margin:14px 0; border:none; border-top:1px solid #eee;">

      <form id="message-form">
        <label for="message-input">כתוב הודעה</label>
        <div class="row">
          <input type="text" id="message-input" placeholder="מה אתה רוצה לכתוב?" required autocomplete="off">
          <button type="submit" id="send-btn" class="btn btn-dark">שלח</button>
        </div>
      </form>
      <div id="message-status"></div>
    </div>

  </section>

</div>

<script src="app.js"></script>
</body>
</html>
